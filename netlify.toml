[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Let API function calls reach the serverless functions before the SPA fallback.
[[redirects]]
  from = "/api/schools"
  to = "/.netlify/functions/schools"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html 永不缓存，确保用户始终拿到引用最新 chunk 的 HTML
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 带哈希的静态资源可长期缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
